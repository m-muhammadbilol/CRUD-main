<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/output.css" />
    <title>Cars</title>
  </head>
  <body id="body">
    <header
      class="p-5 flex items-center justify-between border-b-2 border-slate-400">
      <div class="flex justify-center gap-[40px] items-center">
        <button id="prev" class="btn btn-primary">Prev</button>
        <button id="next" class="btn btn-primary">Next</button>
      </div>

      <div class="flex items-center justify-center gap-[20px]">
        <div>
          <button class="btn btn-primary js-add-button">+ Add</button>
        </div>

        <div class="fab">
          <div
            tabindex="0"
            role="button"
            class="btn btn-lg text-[13px] font-bold btn-circle btn-success">
            <svg
              width="15"
              height="15"
              viewBox="0 0 15 15"
              fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M7.49991 0.876892C3.84222 0.876892 0.877075 3.84204 0.877075 7.49972C0.877075 11.1574 3.84222 14.1226 7.49991 14.1226C11.1576 14.1226 14.1227 11.1574 14.1227 7.49972C14.1227 3.84204 11.1576 0.876892 7.49991 0.876892ZM7.49988 1.82689C4.36688 1.8269 1.82707 4.36672 1.82707 7.49972C1.82707 10.6327 4.36688 13.1725 7.49988 13.1726V1.82689Z"
                fill="currentColor"
                fill-rule="evenodd"
                clip-rule="evenodd"></path>
            </svg>
          </div>

          <div class="">
            <button class="btn dark__mode">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path
                  d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>
            <button class="btn hidden light__mode">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="5" />
                <path
                  d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
              </svg>
            </button>
          </div>
        </div>

        <a href="./register.html">Regirter</a>

        <a href="./login.html">Login</a>
      </div>
    </header>
    <main class="p-5">
      <section class="flex flex-col gap-10">
        <div
          id="contanier"
          class="sm:grid sm:grid-cols-2 gap-5 lg:grid-cols-3"></div>
      </section>
      <section
        id="loader"
        class="sm:grid sm:grid-cols-2 gap-5 lg:grid-cols-3"></section>
    </main>
    <!-- template cards -->
    <template id="templateCard">
      <div class="card bg-base-100 shadow-sm">
        <div
          class="card-body hover:border-indigo-700 border-2 border-transparent rounded-[12px] duration-[0.5s]">
          <h2 class="card-title"></h2>
          <p></p>
          <div class="card-actions justify-end">
            <div class="tooltip" data-tip="Delete">
              <button class="btn btn-error js-delete-button">
                <svg
                  class="text-white pointer-events-none"
                  width="15"
                  height="15"
                  viewBox="0 0 15 15"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M5.5 1C5.22386 1 5 1.22386 5 1.5C5 1.77614 5.22386 2 5.5 2H9.5C9.77614 2 10 1.77614 10 1.5C10 1.22386 9.77614 1 9.5 1H5.5ZM3 3.5C3 3.22386 3.22386 3 3.5 3H5H10H11.5C11.7761 3 12 3.22386 12 3.5C12 3.77614 11.7761 4 11.5 4H11V12C11 12.5523 10.5523 13 10 13H5C4.44772 13 4 12.5523 4 12V4L3.5 4C3.22386 4 3 3.77614 3 3.5ZM5 4H10V12H5V4Z"
                    fill="currentColor"
                    fill-rule="evenodd"
                    clip-rule="evenodd"></path>
                </svg>
              </button>
            </div>
            <div class="tooltip" data-tip="More Info">
              <a target="_blank">
                <button class="btn btn-info js-info-button">
                  <svg
                    class="text-white pointer-events-none"
                    width="15"
                    height="15"
                    viewBox="0 0 15 15"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M7.49991 0.876892C3.84222 0.876892 0.877075 3.84204 0.877075 7.49972C0.877075 11.1574 3.84222 14.1226 7.49991 14.1226C11.1576 14.1226 14.1227 11.1574 14.1227 7.49972C14.1227 3.84204 11.1576 0.876892 7.49991 0.876892ZM1.82707 7.49972C1.82707 4.36671 4.36689 1.82689 7.49991 1.82689C10.6329 1.82689 13.1727 4.36671 13.1727 7.49972C13.1727 10.6327 10.6329 13.1726 7.49991 13.1726C4.36689 13.1726 1.82707 10.6327 1.82707 7.49972ZM8.24992 4.49999C8.24992 4.9142 7.91413 5.24999 7.49992 5.24999C7.08571 5.24999 6.74992 4.9142 6.74992 4.49999C6.74992 4.08577 7.08571 3.74999 7.49992 3.74999C7.91413 3.74999 8.24992 4.08577 8.24992 4.49999ZM6.00003 5.99999H6.50003H7.50003C7.77618 5.99999 8.00003 6.22384 8.00003 6.49999V9.99999H8.50003H9.00003V11H8.50003H7.50003H6.50003H6.00003V9.99999H6.50003H7.00003V6.99999H6.50003H6.00003V5.99999Z"
                      fill="currentColor"
                      fill-rule="evenodd"
                      clip-rule="evenodd"></path>
                  </svg>
                </button>
              </a>
            </div>
            <div class="tooltip" data-tip="Edit">
              <button class="btn btn-success js-edit-button">
                <svg
                  class="text-white pointer-events-none"
                  width="15"
                  height="15"
                  viewBox="0 0 15 15"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M12.1464 1.14645C12.3417 0.951184 12.6583 0.951184 12.8535 1.14645L14.8535 3.14645C15.0488 3.34171 15.0488 3.65829 14.8535 3.85355L10.9109 7.79618C10.8349 7.87218 10.7471 7.93543 10.651 7.9835L6.72359 9.94721C6.53109 10.0435 6.29861 10.0057 6.14643 9.85355C5.99425 9.70137 5.95652 9.46889 6.05277 9.27639L8.01648 5.34897C8.06455 5.25283 8.1278 5.16507 8.2038 5.08907L12.1464 1.14645ZM12.5 2.20711L8.91091 5.79618L7.87266 7.87267L8.12731 8.12732L10.2038 7.08907L13.7929 3.5L12.5 2.20711ZM9.99998 2L8.99998 3H4.9C4.47171 3 4.18056 3.00039 3.95552 3.01877C3.73631 3.03668 3.62421 3.06915 3.54601 3.10899C3.35785 3.20487 3.20487 3.35785 3.10899 3.54601C3.06915 3.62421 3.03669 3.73631 3.01878 3.95552C3.00039 4.18056 3 4.47171 3 4.9V11.1C3 11.5283 3.00039 11.8194 3.01878 12.0445C3.03669 12.2637 3.06915 12.3758 3.10899 12.454C3.20487 12.6422 3.35785 12.7951 3.54601 12.891C3.62421 12.9309 3.73631 12.9633 3.95552 12.9812C4.18056 12.9996 4.47171 13 4.9 13H11.1C11.5283 13 11.8194 12.9996 12.0445 12.9812C12.2637 12.9633 12.3758 12.9309 12.454 12.891C12.6422 12.7951 12.7951 12.6422 12.891 12.454C12.9309 12.3758 12.9633 12.2637 12.9812 12.0445C12.9996 11.8194 13 11.5283 13 11.1V6.99998L14 5.99998V11.1V11.1207C14 11.5231 14 11.8553 13.9779 12.1259C13.9549 12.407 13.9057 12.6653 13.782 12.908C13.5903 13.2843 13.2843 13.5903 12.908 13.782C12.6653 13.9057 12.407 13.9549 12.1259 13.9779C11.8553 14 11.5231 14 11.1207 14H11.1H4.9H4.87934C4.47686 14 4.14468 14 3.87409 13.9779C3.59304 13.9549 3.33469 13.9057 3.09202 13.782C2.7157 13.5903 2.40973 13.2843 2.21799 12.908C2.09434 12.6653 2.04506 12.407 2.0221 12.1259C1.99999 11.8553 1.99999 11.5231 2 11.1207V11.1206V11.1V4.9V4.87935V4.87932V4.87931C1.99999 4.47685 1.99999 4.14468 2.0221 3.87409C2.04506 3.59304 2.09434 3.33469 2.21799 3.09202C2.40973 2.71569 2.7157 2.40973 3.09202 2.21799C3.33469 2.09434 3.59304 2.04506 3.87409 2.0221C4.14468 1.99999 4.47685 1.99999 4.87932 2H4.87935H4.9H9.99998Z"
                    fill="currentColor"
                    fill-rule="evenodd"
                    clip-rule="evenodd"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </template>
    <!-- skeleton -->
    <template id="templateSkeleton">
      <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
          <div class="skeleton h-7 w-[142px]"></div>
          <div class="skeleton h-5 w-28"></div>
          <div class="card-actions justify-end">
            <div class="skeleton h-[41px] w-[48px]"></div>
            <div class="skeleton h-[41px] w-[48px]"></div>
            <div class="skeleton h-[41px] w-[48px]"></div>
          </div>
        </div>
      </div>
    </template>

    <template id="toast">
      <div class="toast">
        <div class="alert alert-info">
          <span id="span"></span>
        </div>
      </div>
    </template>
    <!-- modal -->
    <dialog id="my_modal_3" class="modal">
      <div class="modal-box">
        <form method="dialog">
          <button
            class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">
            ✕
          </button>
        </form>
        <h3 class="text-lg font-bold">Add Car</h3>
        <p class="py-4">Toldiring.</p>
        <form
          id="carAddForm"
          class="w-full h-[250px] overflow-y-auto overflow-x-hidden">
          <input
            name="name"
            type="text"
            placeholder="Car name"
            class="w-full input js-car-name" />
          <input
            name="year"
            type="number"
            min="2000"
            max="2025"
            placeholder="Car year"
            class="input w-full" />
          <input type="color" name="color" class="" />
          <input
            name="maxSpeed"
            type="text"
            placeholder="Max-Speed"
            class="input w-full" />
          <input
            name="horsePower"
            type="number"
            placeholder="horsePower"
            class="input w-full" />
          <input
            name="seatCount"
            type="number"
            placeholder="seatCount"
            class="input w-full" />

          <input
            name="country"
            type="text"
            placeholder="country"
            class="input w-full" />

          <input
            name="fuelType"
            type="text"
            placeholder="fuelType"
            class="input w-full" />

          <input
            name="doorCount"
            type="number"
            placeholder="doorCount"
            class="input w-full" />
          <input
            name="colorName"
            type="text"
            placeholder="colorName"
            class="input w-full" />

          <button class="btn w-full js-btn">Submit</button>
        </form>
      </div>
    </dialog>

    <dialog id="editModal" class="modal">
      <div class="modal-box">
        <form method="dialog">
          <button
            class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">
            ✕
          </button>
        </form>
        <h3 class="text-lg font-bold">Edit</h3>
        <p class="py-4">To'ldiring</p>
        <form
          id="carEditForm"
          class="w-full h-[250px] overflow-y-auto overflow-x-hidden">
          <input
            name="name"
            type="text"
            placeholder="Car name"
            class="w-full input js-car-name" />
          <input
            name="year"
            type="number"
            min="2000"
            max="2025"
            placeholder="Car year"
            class="input w-full" />
          <input type="color" name="color" class="" />
          <input
            name="maxSpeed"
            type="text"
            placeholder="Max-Speed"
            class="input w-full" />
          <input
            name="horsePower"
            type="number"
            placeholder="horsePower"
            class="input w-full" />

          <input
            name="country"
            type="text"
            placeholder="country"
            class="input w-full" />

          <input
            name="fuelType"
            type="text"
            placeholder="fuelType"
            class="input w-full" />

          <button class="btn w-full js-btn">Submit</button>
        </form>
      </div>
    </dialog>

    <script src="./js/app.js"></script>
  </body>
</html>
